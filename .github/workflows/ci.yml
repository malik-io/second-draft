name: Second Draft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run complete test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Run A/B/C experiment
        run: python -m second_draft.run_abc
      - name: Run deterministic demo
        run: python -m second_draft.demo
